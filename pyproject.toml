[project]
name = "quadagent"
version = "0.1.0"
description = "Minimal deep agent for 2D quad meshing of PCB-like boards with Gmsh (explicit FEA) - academic lecture baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "gmsh>=4.13",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.scripts]
quadagent = "quadagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quadagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
